# fly.toml app configuration file generated for hhgoa-rag on 2026-08-22T22:07:17+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'hhgoa-rag'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[http_service.checks]]
  interval = "10s"
  timeout = "5s"
  grace_period = "120s"
  method = "GET"
  path = "/health"

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
